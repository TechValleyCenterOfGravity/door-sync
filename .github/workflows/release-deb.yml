name: Release .deb

# Builds the Debian package and attaches it to a published GitHub release.
#
# Also builds (without uploading) on pull requests that touch packaging, so a
# broken package is caught in review rather than at release time -- the failure
# this guards against is a dependency floor that no Debian package satisfies,
# which is invisible until apt tries to resolve it.

on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'packaging/**'
      - 'pyproject.toml'
      - '.github/workflows/release-deb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    permissions:
      # Needed only by the release-upload step; every other trigger just builds.
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          # Matches the uv_build floor in pyproject.toml. Note ci.yml still pins
          # 0.11.15; worth reconciling the two.
          version: "0.12.13"

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            # Releases are tagged vX.Y.Z; the package version drops the v.
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building door-sync $version"

      - name: Build .deb
        run: |
          packaging/deb/build-deb.sh --version "${{ steps.version.outputs.version }}" --output dist

      # The real test of the Depends line. Architecture is 'all', so the amd64
      # runner can verify a package destined for an arm64 Pi.
      - name: Verify install on Debian trixie
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/dist:ro" debian:trixie-slim sh -euc '
            apt-get update -qq

            echo "== install (apt resolves Depends from trixie) =="
            apt-get install -y --no-install-recommends /dist/door-sync_*_all.deb

            echo "== the CLI runs against system python =="
            door-sync --help > /dev/null
            head -1 /usr/bin/door-sync | grep -qx "#!/usr/bin/python3"

            echo "== dependencies come from dpkg, not a bundled venv =="
            for mod in flask httpx waitress; do
              path=$(python3 -c "import $mod,os;print(os.path.dirname($mod.__file__))")
              dpkg -S "$path" >/dev/null || { echo "$mod is not dpkg-owned: $path"; exit 1; }
              echo "  $mod -> $(dpkg -S "$path" | cut -d: -f1)"
            done

            echo "== service account and state dirs created, service NOT started =="
            getent passwd door-sync > /dev/null
            test -d /var/lib/door-sync && test -d /var/log/door-sync
            grep -q "^ExecStart=/usr/bin/door-sync" /usr/lib/systemd/system/door-sync.service

            echo "== purge keeps the audit log =="
            touch /var/log/door-sync/audit.jsonl
            apt-get purge -y door-sync > /dev/null
            test -f /var/log/door-sync/audit.jsonl || { echo "purge destroyed the audit log"; exit 1; }
            test ! -d /var/lib/door-sync || { echo "purge left state behind"; exit 1; }

            echo "all checks passed"
          '

      - name: Package contents
        run: |
          deb=$(echo dist/door-sync_*_all.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/door-sync_*_all.deb --clobber

      - name: Upload as build artefact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: door-sync-deb
          path: dist/*.deb
