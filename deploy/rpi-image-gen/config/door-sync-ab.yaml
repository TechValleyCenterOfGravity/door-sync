# door-sync appliance: immutable A/B root, OTA-updatable via Raspberry Pi Connect.
#
# Build (arm64 Debian host -- see README):
#   packaging/deb/build-deb.sh --output dist      # or fetch a release asset
#   rpi-image-gen build -S ./deploy/rpi-image-gen/ -c door-sync-ab.yaml -- \
#     IGconf_doorsync_deb=$PWD/dist/door-sync_0.3.1_all.deb
#
# Produces door-sync-ab.update.tar.zst in the deploy dir alongside the disk
# image -- that bundle is what Raspberry Pi Connect pushes to the device.

include:
  file: trixie-minbase-ab.yaml

device:
  # Sets the device name in Raspberry Pi Connect. The deployment is a single
  # device, so this is baked rather than provisioned; a second door would need
  # either a per-site build or a first-boot hostname step.
  hostname: door-sync-1
  # Inherited config targets rpi5; override to match the actual hardware.
  # Must be rpi4 or rpi5: A/B boot updates require a Pi 4 or later, so a Pi 3
  # is not a valid target for this config however this layer is set.
  layer: rpi4

artefact:
  # Bump for every image you cut. This is the version an operator sees when
  # deciding whether to deploy or roll back, so keep it in step with the
  # door-sync release it carries.
  version: 0.3.1

image:
  name: door-sync-ab

  # Inherited: boot 128M / system 512M / data 1G.
  # Measured from the v0.2.0 build: a system slot holds ~266 MiB, so the
  # inherited 512M would fit at ~52%. Kept at 1G for headroom -- a larger
  # Python or another dependency should not require repartitioning a device
  # that has to be physically reflashed. Costs 1 GiB of card, per slot, twice.
  system_part_size: 1G

  # Shared across slots. Sized for audit.jsonl growth between logrotate runs --
  # the only thing here that accumulates. Empty at build, so unlike the system
  # slots this one cannot be measured from an image; it stays a judgement call.
  data_part_size: 4G

layer:
  app: door-sync
